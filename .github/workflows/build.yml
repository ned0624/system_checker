name: Build Windows exe

# 程式有更新推到 master 時自動打包，並建立 Release（tag: v1.0.<執行編號>）；也可以在 Actions 頁面手動執行
on:
  push:
    branches: [master]
    paths:
      - "*.py"
      - "*.bat"
      - "*.ps1"
      - "*.bat.txt"
      - "config.json"
      - "excluded_ids.txt"
      - "ci_check_csv.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 在 Windows PowerShell 5.1 實際執行兩支撈取腳本，確認 CSV 能被 fill_check 讀取
  test-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pandas openpyxl

      - name: fill_check template mode (weekly file from template)
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($m in 'weekswap', 'rule', 'ruletext', 'locked', 'weekdir') {
            python ci_template_test.py "$env:RUNNER_TEMP\tpl_$m" $m
            if ($LASTEXITCODE -ne 0) { throw "template test ($m) failed" }
          }

      - name: Check .bat.txt copies are in sync
        shell: bash
        run: |
          for f in run_weekly build_exe; do
            iconv -f cp950 -t utf-8 $f.bat | cmp - $f.bat.txt || { echo "$f.bat.txt 與 $f.bat 內容不同，請重新產生"; exit 1; }
          done

      - name: ps1 must be pure ASCII (PowerShell 5.1 reads BOM-less files as ANSI)
        shell: bash
        run: |
          if grep -nP '[^\x00-\x7F]' EventLogCheck*.ps1; then echo "non-ASCII characters found in ps1"; exit 1; fi

      - name: Syntax check
        shell: powershell
        run: |
          foreach ($f in 'EventLogCheck.ps1', 'EventLogCheck_Local.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Output "$f : $_" }; throw "syntax error in $f" }
          }

      - name: ISO week in ps1 matches Python, and {week} in OutDir
        shell: powershell
        run: |
          # load Get-IsoWeek from the script itself
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\EventLogCheck_Local.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $args[0].Name -eq 'Get-IsoWeek' }, $true)
          Invoke-Expression $fn[0].Extent.Text
          $cases = @{ '2024-12-30'='W2501'; '2026-12-31'='W2653'; '2027-01-01'='W2653'; '2027-01-04'='W2701';
                      '2026-10-22'='W2643'; '2026-01-01'='W2601'; '2020-12-31'='W2053'; '2021-01-03'='W2053' }
          foreach ($k in $cases.Keys) {
            $got = Get-IsoWeek ([datetime]::ParseExact($k, 'yyyy-MM-dd', $null))
            Write-Output "$k -> $got"
            if ($got -ne $cases[$k]) { throw "Get-IsoWeek($k) = $got, expected $($cases[$k])" }
          }
          $py = python -c "from datetime import date; y,w,_=date.today().isocalendar(); print(f'W{y%100:02d}{w:02d}')"
          $ps = Get-IsoWeek (Get-Date)
          if ($py -ne $ps) { throw "today: python $py vs ps1 $ps" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -OutDir "$env:RUNNER_TEMP\wk\{week}\Reference\BOS" -LogDir "$env:RUNNER_TEMP\wk\logs" -ExcludeFile "$env:RUNNER_TEMP\none.txt"
          if ($LASTEXITCODE -ne 0) { throw "ps1 with {week} failed: $LASTEXITCODE" }
          $csv = Get-ChildItem "$env:RUNNER_TEMP\wk\$ps\Reference\BOS" -Filter *.csv
          if (-not $csv) { throw "CSV not written to week folder $ps" }
          Write-Output "CSV in week folder: $($csv.FullName)"

      - name: Run local version (explicit parameters)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -OutDir "$env:RUNNER_TEMP\ev" -LogDir "$env:RUNNER_TEMP\logs" -ExcludeFile "$env:RUNNER_TEMP\none.txt"
          if ($LASTEXITCODE -ne 0) { throw "local version failed: $LASTEXITCODE" }

      - name: SETTINGS block with non-ASCII folders (UTF-8 no BOM / UTF-8 BOM / ANSI)
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python ci_settings_test.py make "$env:RUNNER_TEMP\st"
          if ($LASTEXITCODE -ne 0) { throw "make failed" }
          foreach ($v in 'utf8_nobom', 'utf8_bom', 'ansi') {
            Write-Output "--- $v"
            powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\st\$v\EventLogCheck_Local.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$v failed: $LASTEXITCODE" }
          }
          python ci_settings_test.py check "$env:RUNNER_TEMP\st" "$env:COMPUTERNAME"
          if ($LASTEXITCODE -ne 0) { throw "settings check failed" }

      - name: No events left gives exit 2 and no CSV (period in 2000)
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -StartTime 2000-01-01 -EndTime 2000-01-02 -OutDir "$env:RUNNER_TEMP\ev0" -LogDir "$env:RUNNER_TEMP\logs0" -ExcludeFile "$env:RUNNER_TEMP\none.txt" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 2 -or $out -notmatch 'no CSV written') { throw "local no-events: expected exit 2, got $LASTEXITCODE" }
          Set-Content "$env:RUNNER_TEMP\lh.txt" "localhost"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck.ps1 -StartTime 2000-01-01 -EndTime 2000-01-02 -ServerList "$env:RUNNER_TEMP\lh.txt" -OutDir "$env:RUNNER_TEMP\ev0" -LogDir "$env:RUNNER_TEMP\logs0" -ExcludeFile "$env:RUNNER_TEMP\none.txt" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 2 -or $out -notmatch '0 with CSV, 1 without events') { throw "server-list no-events: expected exit 2, got $LASTEXITCODE" }
          if (Get-ChildItem "$env:RUNNER_TEMP\ev0" -Filter *.csv) { throw "CSV must not be written when no events are left" }
          exit 0

      - name: Folder without write permission fails at start
        shell: powershell
        run: |
          $ro = "$env:RUNNER_TEMP\readonly"
          New-Item -ItemType Directory -Force $ro | Out-Null
          icacls $ro /deny "$($env:USERNAME):(OI)(CI)(W)" | Out-Null
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -OutDir $ro -LogDir "$env:RUNNER_TEMP\logs_ro" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'Cannot write to folder' -or $out -match 'done') { throw "read-only folder: expected exit 1 with permission message, got $LASTEXITCODE" }
          exit 0

      - name: Period settings (StartTime / EndTime / default 7 days)
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $now = Get-Date
          # a. explicit period: CSV file date = end date, events inside the period
          $s = $now.AddDays(-10).ToString('yyyy-MM-dd') + ' 00:00'
          $e = $now.AddHours(-1).ToString('yyyy-MM-dd HH:mm')
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -StartTime $s -EndTime $e -OutDir "$env:RUNNER_TEMP\per" -LogDir "$env:RUNNER_TEMP\per_logs" -ExcludeFile "$env:RUNNER_TEMP\none.txt" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -notin 0, 2) { throw "explicit period failed: $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape("Period     : $s ~ $e")) { throw "Period line missing or wrong" }
          python ci_period_check.py "$env:RUNNER_TEMP\per" "$s" "$e"
          if ($LASTEXITCODE -ne 0) { throw "period check failed" }
          # b. only StartTime: end = now
          $s2 = $now.AddDays(-3).ToString('yyyy-MM-dd')
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -StartTime $s2 -OutDir "$env:RUNNER_TEMP\per2" -LogDir "$env:RUNNER_TEMP\per_logs" -ExcludeFile "$env:RUNNER_TEMP\none.txt" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -notin 0, 2) { throw "StartTime only failed: $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape("Period     : $s2 00:00 ~ $($now.ToString('yyyy-MM-dd'))")) { throw "StartTime only: end should be now" }
          # c. SETTINGS without Days / StartTime / EndTime -> last 7 days
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nodays" | Out-Null
          (Get-Content .\EventLogCheck_Local.ps1) | Where-Object { $_ -notmatch '^(Days|StartTime|EndTime)\s*=' } | Set-Content "$env:RUNNER_TEMP\nodays\EventLogCheck_Local.ps1"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\nodays\EventLogCheck_Local.ps1" -OutDir "$env:RUNNER_TEMP\per3" -LogDir "$env:RUNNER_TEMP\per_logs" -ExcludeFile "$env:RUNNER_TEMP\none.txt" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -notin 0, 2) { throw "no Days setting failed: $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape("Period     : $($now.AddDays(-7).ToString('yyyy-MM-dd'))")) { throw "default should be 7 days" }
          # d. invalid date and e. start after end -> exit 1
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -StartTime 2026-13-40 -OutDir "$env:RUNNER_TEMP\per4" -LogDir "$env:RUNNER_TEMP\per_logs" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'not a valid date') { throw "invalid date: expected exit 1, got $LASTEXITCODE" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -StartTime 2026-10-22 -EndTime 2026-10-21 -OutDir "$env:RUNNER_TEMP\per4" -LogDir "$env:RUNNER_TEMP\per_logs" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'must be earlier') { throw "start after end: expected exit 1, got $LASTEXITCODE" }
          exit 0

      - name: Failures must exit 1 and must not say done
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck_Local.ps1 -OutDir 'C:\bad<>|dir' -LogDir "$env:RUNNER_TEMP\logs" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 1 -or $out -match 'done') { throw "bad OutDir: expected exit 1 without 'done', got $LASTEXITCODE" }
          Set-Content "$env:RUNNER_TEMP\bad_servers.txt" "no-such-host-xyz"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck.ps1 -ServerList "$env:RUNNER_TEMP\bad_servers.txt" -OutDir "$env:RUNNER_TEMP\ev2" -LogDir "$env:RUNNER_TEMP\logs2" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'all 1 servers failed') { throw "all servers failed: expected exit 1, got $LASTEXITCODE" }
          exit 0

      - name: Run server-list version (localhost + unreachable host + exclude list)
        shell: powershell
        run: |
          Set-Content "$env:RUNNER_TEMP\servers.txt" "# comment`r`nlocalhost`r`n`r`nno-such-host-xyz"
          Set-Content "$env:RUNNER_TEMP\exclude.txt" "# test`r`n11, 46"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\EventLogCheck.ps1 -ServerList "$env:RUNNER_TEMP\servers.txt" -OutDir "$env:RUNNER_TEMP\ev" -LogDir "$env:RUNNER_TEMP\logs" -ExcludeFile "$env:RUNNER_TEMP\exclude.txt" 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'FullyQualifiedErrorId') { throw "raw PowerShell error shown to user" }
          if ($LASTEXITCODE -ne 0) { throw "server-list version failed: $LASTEXITCODE" }

      - name: Check output
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\ev" | Format-Table Name, Length
          python ci_check_csv.py "$env:RUNNER_TEMP\ev" "$env:COMPUTERNAME" "$env:RUNNER_TEMP\logs"
          if ($LASTEXITCODE -ne 0) { throw "CSV check failed" }

  build:
    needs: test-ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pyinstaller pandas openpyxl

      # 與 build_exe.bat 相同的打包參數
      - name: Build search_ignore.exe
        run: pyinstaller --onefile --noconfirm --exclude-module pandas --exclude-module numpy --exclude-module PIL --exclude-module lxml search_ignore.py

      - name: Build fill_check (onedir)
        run: pyinstaller --onedir --noconfirm --exclude-module PIL --exclude-module lxml fill_check.py

      # 打包成與 D:\SystemCheck 相同的資料夾結構
      - name: Assemble SystemCheck folder
        shell: pwsh
        run: |
          $out = "SystemCheck"
          New-Item -ItemType Directory -Force $out, "$out\EventLog", "$out\logs" | Out-Null
          Copy-Item -Recurse dist\fill_check "$out\fill_check"
          Copy-Item config.json "$out\fill_check\config.json"
          Copy-Item dist\search_ignore.exe, run_weekly.bat, EventLogCheck.ps1, EventLogCheck_Local.ps1, excluded_ids.txt, README.md $out
          Compress-Archive -Path $out -DestinationPath SystemCheck.zip
          Copy-Item dist\search_ignore.exe search_ignore.exe

      - name: Smoke test
        shell: pwsh
        run: |
          # 搜尋工具：輸入 q 應正常結束（exit 0）
          "q" | .\SystemCheck\search_ignore.exe
          if ($LASTEXITCODE -ne 0) { throw "search_ignore.exe failed: $LASTEXITCODE" }
          # 填表程式：config 的路徑在 runner 上不存在，應提示 paths.csv_dir 並以 1 結束（代表 exe 能啟動、讀到 config）
          $o = & .\SystemCheck\fill_check\fill_check.exe 2>&1 | Out-String
          Write-Output $o
          if ($LASTEXITCODE -ne 1 -or $o -notmatch "paths\.csv_dir") { throw "fill_check.exe did not start correctly: $LASTEXITCODE" }
          exit 0

      - uses: actions/upload-artifact@v5
        with:
          name: SystemCheck
          path: |
            SystemCheck.zip
            search_ignore.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SystemCheck v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            - SystemCheck.zip：解壓到 D:\ 會得到 D:\SystemCheck（fill_check、search_ignore.exe、run_weekly.bat、EventLogCheck.ps1）
            - search_ignore.exe：可忽略事件ID 搜尋工具，單一檔案
            使用前請修改 SystemCheck\fill_check\config.json 的 paths
          files: |
            SystemCheck.zip
            search_ignore.exe
